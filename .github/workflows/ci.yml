name: ci

# Typecheck both packages, run the unit tests, and make sure the web UI still
# builds. Runs on every push and pull request so parser/type regressions are
# caught before they land — there is no other automated gate on this repo.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck backend
        run: bunx tsc --noEmit

      - name: Unit tests
        run: bun test

      - name: Install web dependencies
        run: cd web && bun install --frozen-lockfile

      - name: Typecheck web
        run: cd web && bunx tsc --noEmit

      - name: Build web UI
        run: cd web && bun run build
